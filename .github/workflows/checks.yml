name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - name: Install photo export test dependency
        run: python3 -m pip install Pillow
      - name: Python tests and recipe syntax
        run: python3 -m unittest discover -s tests -v
      - name: Build open-source access payloads
        run: python3 tools/build.py payloads
      - name: Test native catalog logic without Samsung references
        run: dotnet run --project tests/CatalogTests.csproj -- launcher/assets/apps.json

      - name: Test phone companion pairing, layout, photo store and HTTP API
        run: dotnet run --project tests/CompanionTests.csproj
      - name: Test private photo catalog validation
        run: dotnet run --project tests/PhotoCatalogTests.csproj
      - name: Test theme preference persistence
        run: dotnet run --project tests/ThemePreferenceTests.csproj -- launcher/assets/app-icons/themes
      - name: Compile native routing helper without Samsung references
        run: dotnet build launcher/probe/HomeRoute.csproj -c Release
      - name: Audit public tracked source and assets
        run: python3 tools/audit_public.py

      - name: Validate bundled packs and exercise authoring tool
        run: |
          dotnet run --project tools/ThemeTool -- list launcher/assets/app-icons/themes
          theme_test_root=$(mktemp -d)
          dotnet run --project tools/ThemeTool -- create example "Example" "$theme_test_root/example"
          dotnet run --project tools/ThemeTool -- validate "$theme_test_root/example"
